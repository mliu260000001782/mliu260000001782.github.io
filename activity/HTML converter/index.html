<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to HTML Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <nav>
        <div class="nav-title">Markdown Converter</div>
        <div class="nav-subtitle">Markdown to HTML</div>
    </nav>

    <main>
        <h1>Markdown to HTML Converter</h1>

        <p class="description">
            Write Markdown on the left and see the generated HTML and preview.
        </p>

        <div id="container">

            <div class="container">
                <h2>Markdown Input:</h2>
                <textarea id="markdown-input"
                    placeholder="Enter your markdown here..."></textarea>
            </div>

            <div class="container">
                <h2>Raw HTML Output:</h2>
                <div id="html-output"></div>
            </div>

            <div class="container">
                <h2>HTML Preview:</h2>
                <div id="preview"></div>
            </div>

        </div>
    </main>

    <footer>
        Markdown to HTML Converter
    </footer>

    <script src="app.js"></script>

</body>
</html>
